<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gate8 Web Novel Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader {
            border: 3px solid #374151;
            border-bottom-color: #10b981; /* Emerald 500 */
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }
        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Custom scrollbar for text area */
        textarea::-webkit-scrollbar, .read-area::-webkit-scrollbar { width: 8px; }
        textarea::-webkit-scrollbar-thumb, .read-area::-webkit-scrollbar-thumb { background-color: #4b5563; border-radius: 4px; }
        .highlight { background-color: rgba(16, 185, 129, 0.2); border-left: 4px solid #10b981; padding-left: 8px; transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 h-screen flex flex-col font-sans selection:bg-emerald-500/30">

    <header class="bg-gray-900 border-b border-gray-800 p-4 shadow-lg flex items-center justify-between z-10">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-lg bg-emerald-600 flex items-center justify-center font-bold text-xl shadow-[0_0_15px_rgba(16,185,129,0.4)]">📖</div>
            <div>
                <h1 class="text-xl font-bold text-white tracking-tight">Gate8 Reader</h1>
                <p class="text-xs text-emerald-400 font-medium">Neural Web Novel Narrator</p>
            </div>
        </div>

        <!-- Controls -->
        <div class="flex items-center space-x-4">
            <!-- Voice Selector -->
            <div class="flex flex-col">
                <label for="voiceSelect" class="text-[10px] text-gray-400 uppercase tracking-wider mb-1">Narrator Voice</label>
                <select id="voiceSelect" class="bg-gray-800 border border-gray-700 text-sm rounded-md px-3 py-1.5 outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all">
                    <!-- Standard Kokoro Voices -->
                    <option value="af_bella">Bella (American Female)</option>
                    <option value="af_sarah">Sarah (American Female)</option>
                    <option value="am_adam">Adam (American Male)</option>
                    <option value="am_michael">Michael (American Male)</option>
                    <option value="bf_emma">Emma (British Female)</option>
                    <option value="bf_isabella">Isabella (British Female)</option>
                    <option value="bm_george">George (British Male)</option>
                    <option value="bm_lewis">Lewis (British Male)</option>
                </select>
            </div>

            <!-- Model Selector -->
            <div class="flex flex-col">
                <label for="modelSelect" class="text-[10px] text-gray-400 uppercase tracking-wider mb-1">Editor Model (< 2GB)</label>
                <select id="modelSelect" class="bg-gray-800 border border-gray-700 text-sm rounded-md px-3 py-1.5 outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all">
                    <option value="">Loading models...</option>
                </select>
            </div>

            <!-- Grammar Toggle -->
            <div class="flex flex-col items-center justify-center ml-2">
                <label class="text-[10px] text-gray-400 uppercase tracking-wider mb-1">Fix Grammar</label>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="grammarToggle" class="sr-only peer">
                    <div class="w-10 h-5 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-gray-300 after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500 peer-checked:after:bg-white shadow-inner"></div>
                </label>
            </div>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">

        <!-- Left Panel: Input Area -->
        <div id="inputPanel" class="w-1/2 border-r border-gray-800 flex flex-col bg-gray-900 transition-all duration-500">
            <div class="p-3 border-b border-gray-800 bg-gray-900/50 flex justify-between items-center">
                <h2 class="text-sm font-semibold text-gray-300 uppercase tracking-wider">Paste Chapter Text</h2>
                <button id="clearBtn" class="text-xs text-gray-500 hover:text-red-400 transition-colors">Clear</button>
            </div>
            <textarea id="novelInput" class="flex-1 w-full bg-transparent p-6 text-gray-300 resize-none outline-none focus:bg-gray-800/30 transition-colors leading-relaxed text-lg" placeholder="Paste your translated web novel chapter here..."></textarea>
        </div>

        <!-- Right Panel: Reading Area & Progress -->
        <div id="readPanel" class="flex-1 flex flex-col bg-gray-950 relative">
            <div class="p-3 border-b border-gray-800 bg-gray-900/50 flex justify-between items-center">
                <h2 class="text-sm font-semibold text-gray-300 uppercase tracking-wider">Teleprompter</h2>
                <span id="progressText" class="text-xs font-medium text-emerald-500 bg-emerald-500/10 px-2 py-1 rounded">0 / 0 Paragraphs</span>
            </div>

            <div id="displayText" class="flex-1 p-8 overflow-y-auto read-area text-xl leading-loose text-gray-400 font-serif space-y-6">
                <!-- Text chunks will be injected here -->
                <div class="flex items-center justify-center h-full text-gray-600 italic">
                    Text will appear here during narration...
                </div>
            </div>

            <!-- Overlay for Loading/Processing -->
            <div id="processingOverlay" class="absolute inset-0 bg-gray-950/90 backdrop-blur-sm hidden flex-col items-center justify-center z-20">
                <div class="loader w-12 h-12 mb-4"></div>
                <h3 id="overlayTitle" class="text-xl font-bold text-white mb-2">Phase 1: Editing Text</h3>
                <p id="overlaySubtitle" class="text-sm text-gray-400">Loading LLM to unified memory...</p>
                <div class="w-64 bg-gray-800 rounded-full h-2 mt-6 overflow-hidden">
                    <div id="overlayProgressBar" class="bg-emerald-500 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-gray-900 border-t border-gray-800 p-4 shadow-[0_-4px_15px_rgba(0,0,0,0.2)] z-10">
        <div class="max-w-3xl mx-auto flex items-center justify-between">

            <!-- Status -->
            <div class="w-1/3">
                <div class="text-xs text-gray-500 uppercase tracking-wider mb-1">Gateway Status</div>
                <div id="gatewayStatus" class="text-sm font-medium text-gray-300 truncate">Idle</div>
            </div>

            <!-- Playback Controls -->
            <div class="flex items-center space-x-4">
                <button id="playBtn" class="w-14 h-14 bg-emerald-600 hover:bg-emerald-500 text-white rounded-full flex items-center justify-center shadow-lg transition-transform transform hover:scale-105 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </button>
                <button id="stopBtn" class="w-10 h-10 bg-gray-800 hover:bg-red-500/20 hover:text-red-400 text-gray-400 border border-gray-700 rounded-full flex items-center justify-center transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z" />
                    </svg>
                </button>
            </div>

            <!-- Volume / Spare space -->
            <div class="w-1/3 text-right">
                <span id="etaText" class="text-xs text-gray-500">Ready to orchestrate.</span>
            </div>
        </div>
    </footer>

    <!-- Hidden audio element for sequential playback -->
    <audio id="audioPlayer" class="hidden"></audio>

    <script>
        // Use current origin to hit the Gate8 main.py API
        const BASE_URL = window.location.origin;

        // DOM Elements
        const novelInput = document.getElementById('novelInput');
        const displayText = document.getElementById('displayText');
        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');
        const clearBtn = document.getElementById('clearBtn');
        const grammarToggle = document.getElementById('grammarToggle');
        const modelSelect = document.getElementById('modelSelect');
        const voiceSelect = document.getElementById('voiceSelect');
        const audioPlayer = document.getElementById('audioPlayer');

        const gatewayStatus = document.getElementById('gatewayStatus');
        const progressText = document.getElementById('progressText');
        const overlay = document.getElementById('processingOverlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlaySubtitle = document.getElementById('overlaySubtitle');
        const overlayProgressBar = document.getElementById('overlayProgressBar');

        // State Variables
        let paragraphs = [];
        let currentIndex = 0;
        let isPlaying = false;
        let isStopped = false;

        async function loadModels() {
            try {
                // Send dummy request to trigger the model list fallback in Gate8
                const response = await fetch(`${BASE_URL}/v1/chat/completions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: [] })
                });

                const data = await response.json();

                if (data.available_models && data.available_models.length > 0) {
                    modelSelect.innerHTML = '';
                    data.available_models.forEach(model => {
                        const option = document.createElement('option');
                        option.value = model;
                        option.textContent = model;
                        modelSelect.appendChild(option);
                    });
                } else {
                    modelSelect.innerHTML = '<option value="">No models found</option>';
                }
            } catch (err) {
                console.error("Gateway offline:", err);
                modelSelect.innerHTML = '<option value="">Cannot connect to Gate8</option>';
            }
        }

        function showOverlay(title, subtitle, progress = 0) {
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            overlayTitle.textContent = title;
            overlaySubtitle.textContent = subtitle;
            overlayProgressBar.style.width = `${progress}%`;
        }

        function hideOverlay() {
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
        }

        function chunkText(text) {
            // Split by double newline to get natural paragraphs
            const rawParagraphs = text.split(/\n\n+/);
            const cleanChunks = [];

            // Re-combine very short paragraphs (like single dialogue lines) so TTS doesn't stutter too much
            let currentChunk = "";
            for (const p of rawParagraphs) {
                const cleanP = p.trim().replace(/\n/g, ' ');
                if (!cleanP) continue;

                if (currentChunk.length + cleanP.length < 500) {
                    currentChunk += (currentChunk ? " " : "") + cleanP;
                } else {
                    if (currentChunk) cleanChunks.push(currentChunk);
                    currentChunk = cleanP;
                }
            }
            if (currentChunk) cleanChunks.push(currentChunk);
            return cleanChunks;
        }

        function renderTeleprompter() {
            displayText.innerHTML = '';
            paragraphs.forEach((p, idx) => {
                const pEl = document.createElement('p');
                pEl.id = `para-${idx}`;
                pEl.textContent = p;
                pEl.className = "transition-all duration-300 cursor-pointer hover:text-gray-200";

                // Allow user to click a paragraph to jump to it
                pEl.onclick = () => {
                    if (isPlaying) {
                        isStopped = true;
                        audioPlayer.pause();
                    }
                    currentIndex = idx;
                    updateProgress();
                    highlightCurrent();
                };

                displayText.appendChild(pEl);
            });
        }

        function highlightCurrent() {
            // Remove old highlights
            document.querySelectorAll('.read-area p').forEach(el => {
                el.classList.remove('highlight', 'text-white');
                el.classList.add('text-gray-400');
            });

            // Add new highlight
            const currentEl = document.getElementById(`para-${currentIndex}`);
            if (currentEl) {
                currentEl.classList.remove('text-gray-400');
                currentEl.classList.add('highlight', 'text-white');
                // Smooth scroll into view
                currentEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function updateProgress() {
            progressText.textContent = `${Math.min(currentIndex + 1, paragraphs.length)} / ${paragraphs.length} Paragraphs`;
        }

        async function processGrammarPhase() {
            const model = modelSelect.value;
            if (!model) {
                alert("Please select a lightweight model in the top right to use the Grammar Fix feature.");
                return false;
            }

            gatewayStatus.textContent = "Swapping to LLM...";
            const fixedParagraphs = [];

            for (let i = 0; i < paragraphs.length; i++) {
                if (isStopped) return false;

                const progress = Math.round((i / paragraphs.length) * 100);
                showOverlay("Phase 1: Neural Editing", `Fixing grammar & flow: Paragraph ${i+1} of ${paragraphs.length}`, progress);

                const prompt = `You are a professional editor. Fix any grammatical errors, awkward phrasing, or spelling mistakes in the following web novel excerpt. Do not change the story, just improve the prose. Return ONLY the edited text, no conversational filler.\n\nTEXT:\n${paragraphs[i]}`;

                try {
                    const response = await fetch(`${BASE_URL}/v1/chat/completions`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            model: model,
                            messages: [
                                {"role": "system", "content": "You are a professional book editor. Output only the corrected text."},
                                {"role": "user", "content": prompt}
                            ],
                            temperature: 0.3
                        })
                    });

                    if (!response.ok) throw new Error("LLM Request Failed");
                    const data = await response.json();
                    let editedText = data.choices[0].message.content.trim();

                    // Cleanup common LLM artifacts if it ignores instructions
                    editedText = editedText.replace(/^Here is the edited text:?\n*/i, '');

                    fixedParagraphs.push(editedText);
                } catch (err) {
                    console.error("Grammar fix failed on chunk", i, err);
                    fixedParagraphs.push(paragraphs[i]); // Fallback to original on error
                }
            }

            paragraphs = fixedParagraphs;
            renderTeleprompter();
            return true;
        }

        async function playNextChunk() {
            if (isStopped || currentIndex >= paragraphs.length) {
                finishReading();
                return;
            }

            highlightCurrent();
            updateProgress();

            const textToRead = paragraphs[currentIndex];
            const voice = voiceSelect.value;

            gatewayStatus.textContent = `Generating Audio (Chunk ${currentIndex+1})...`;

            try {
                const response = await fetch(`${BASE_URL}/v1/audio/speech`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        input: textToRead,
                        voice: voice
                    })
                });

                if (!response.ok) throw new Error("TTS generation failed");

                gatewayStatus.textContent = `Playing...`;

                const audioBlob = await response.blob();
                const audioUrl = URL.createObjectURL(audioBlob);

                audioPlayer.src = audioUrl;
                audioPlayer.play();

            } catch (err) {
                console.error("TTS Error:", err);
                gatewayStatus.textContent = "TTS Error. Skipping...";
                // Skip to next chunk automatically on error
                currentIndex++;
                setTimeout(playNextChunk, 1000);
            }
        }

        // Trigger loop when audio ends
        audioPlayer.onended = () => {
            if (!isStopped) {
                currentIndex++;
                playNextChunk();
            }
        };

        async function startReading() {
            const rawText = novelInput.value.trim();
            if (!rawText) {
                alert("Please paste some text first.");
                return;
            }

            // Lock UI
            isPlaying = true;
            isStopped = false;
            playBtn.disabled = true;
            stopBtn.disabled = false;
            novelInput.disabled = true;

            // Initialize chunks
            paragraphs = chunkText(rawText);
            currentIndex = 0;
            renderTeleprompter();

            // Phase 1: Grammar Fix (If enabled)
            if (grammarToggle.checked) {
                const success = await processGrammarPhase();
                if (!success || isStopped) {
                    finishReading();
                    return;
                }
            }

            // Phase 2: Start Narration Loop
            hideOverlay();
            playNextChunk();
        }

        function finishReading() {
            isPlaying = false;
            isStopped = true;
            audioPlayer.pause();
            hideOverlay();

            playBtn.disabled = false;
            stopBtn.disabled = true;
            novelInput.disabled = false;
            gatewayStatus.textContent = "Idle";
        }

        // Event Listeners
        playBtn.addEventListener('click', startReading);
        stopBtn.addEventListener('click', finishReading);
        clearBtn.addEventListener('click', () => {
            novelInput.value = '';
            displayText.innerHTML = '<div class="flex items-center justify-center h-full text-gray-600 italic">Text will appear here during narration...</div>';
            progressText.textContent = "0 / 0 Paragraphs";
        });

        // Initialization
        loadModels();
    </script>
</body>
</html>
